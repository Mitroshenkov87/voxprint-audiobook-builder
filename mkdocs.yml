site_name: Voxprint AI Audiobook Builder
site_description: Train a voice from a short recording and narrate books offline.
site_url: https://mitroshenkov87.github.io/voxprint-audiobook-builder/
repo_url: https://github.com/Mitroshenkov87/voxprint-audiobook-builder
repo_name: Mitroshenkov87/voxprint-audiobook-builder
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

hooks:
  - tools/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: false
            members_order: source
            show_if_no_docstring: false
            filters: ["!^_"]
            heading_level: 2

# Existing pages link to repository files that sit next to docs/ (LICENSE, the root
# AGENTS.md, screenshots). Those targets are not pages of this site, so a missing
# in-site target is reported as info. --strict still fails the build on a real error
# and on a markdown file left out of the nav.
validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: info
  not_found: info
  anchors: info

