# Accepted pip-audit advisories. The release audit blocks on high and critical
# advisories that are not listed here. Each entry needs an id and a reason.
# "package" is optional; when set, the id matches only that distribution.
# Match is against the advisory id and any alias (PYSEC, GHSA, CVE).

# transformers 4.57.6. The published fixes are on the 5.x line. qwen-asr 0.0.6
# and qwen-tts 0.1.1 pin transformers 4.57.x (their METADATA says ==4.57.6 and
# ==4.57.3), and transformers 5.x breaks them. requirements-verified.txt pins
# 4.57.6 for that stack.

[[advisory]]
id = "GHSA-29pf-2h5f-8g72"
package = "transformers"
reason = "Remote code execution in transformers (CVE-2026-4372). The published fix is 5.3.0. qwen-tts 0.1.1 and qwen-asr 0.0.6 pin transformers 4.57.x, and 5.x breaks them, so 4.57.6 stays."

[[advisory]]
id = "GHSA-fgcw-684q-jj6r"
package = "transformers"
reason = "Arbitrary code execution while loading a LightGlue model (CVE-2026-5241). The published fix is 5.5.0. qwen-tts 0.1.1 and qwen-asr 0.0.6 pin transformers 4.57.x, and 5.x breaks them, so 4.57.6 stays."

[[advisory]]
id = "GHSA-xrqw-3rrv-vx5w"
package = "transformers"
reason = "save_pretrained can write outside the target folder via a chat-template name (CVE-2026-9856). The published fix is 5.10.0. qwen-tts 0.1.1 and qwen-asr 0.0.6 pin transformers 4.57.x, and 5.x breaks them, so 4.57.6 stays."

[[advisory]]
id = "GHSA-x9r9-c232-4q39"
package = "transformers"
reason = "Custom generation code is downloaded before trust consent (CVE-2026-80047). The affected range runs through 5.8.1, so there is no 4.57.x fix. qwen-tts 0.1.1 and qwen-asr 0.0.6 pin transformers 4.57.x, and 5.x breaks them, so 4.57.6 stays."

[[advisory]]
id = "PYSEC-2025-217"
package = "transformers"
reason = "X-CLIP checkpoint conversion deserializes untrusted data (CVE-2025-14929). 4.57.6 is affected and the last affected release is 5.0.0rc0, so the fix is on the 5.x line. qwen-tts 0.1.1 and qwen-asr 0.0.6 pin transformers 4.57.x, and 5.x breaks them, so 4.57.6 stays."
