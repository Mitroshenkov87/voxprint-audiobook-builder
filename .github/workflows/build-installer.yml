name: build-installer

# Builds the second installer, Voxprint-Setup-github-build.exe, from source on a clean Windows runner:
# the same build.bat flow as the local build (venv, PyTorch via uv, PyInstaller --onedir, Inno Setup).
# Triggers: a pushed tag "v*" (the installer is attached to the GitHub release of that tag, with its SHA-256)
# or a manual run (the installer is only uploaded as a workflow artifact).
# Besides the full installer (Voxprint-Setup-github-build.exe) the "build" job also builds the ONLINE installer:
# Voxprint-Setup-online.exe (a few MB + vc_redist) that downloads the payload parts (Voxprint-payload-NN.zip, each < 2 GiB)
# listed in manifest-<channel>.json from the release assets, verified by SHA-256 and resumable.  The quick job
# "online-smoke" tests that chain (payload split, manifest, Inno /DONLINE compile, silent install, reuse, failure, uninstall)
# with a fake program folder in a few minutes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the builds to this existing release tag (empty = artifacts only)"
        required: false
        default: ""
      build_full:
        description: "Also build and attach the big full installer (Voxprint-Setup-github-build.exe). false = only the small online installer + payload parts + manifest"
        type: boolean
        required: false
        default: false
      skip_tests:
        description: "build-thin only: skip the unit-test step (to repeat a build quickly)"
        type: boolean
        required: false
        default: false
      smoke_only:
        description: "Only run the quick smoke jobs (online-smoke, thin-smoke); no full build, nothing is attached to a release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write      # attach the installer to the release

jobs:
  online-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: PyInstaller
        shell: pwsh
        run: python -m pip install --quiet pyinstaller
      - name: A fake program folder and the licence files the script expects
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Voxprint\_internal\lib, build\notices | Out-Null
          Copy-Item "$env:WINDIR\System32\whoami.exe" dist\Voxprint\Voxprint.exe
          python -c "import os; [open(f'dist/Voxprint/_internal/lib/blob{i}.bin','wb').write(os.urandom(6*1024*1024)) for i in range(5)]"
          Copy-Item THIRD_PARTY_NOTICES.md build\notices\
      - name: Build the online installer (small parts, served from localhost)
        shell: pwsh
        run: |
          ./installer/build_online.ps1 -Tag v0.0.0-beta -BaseUrl http://127.0.0.1:8099 -ManifestUrl http://127.0.0.1:8099/manifest-beta.json -LimitMib 8 -Python python
      - name: Serve the parts
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "-m","http.server","8099","--bind","127.0.0.1","--directory","build\online-release" -WindowStyle Hidden
          Start-Sleep 3
          (Invoke-WebRequest http://127.0.0.1:8099/manifest-beta.json -UseBasicParsing).StatusCode
      - name: Silent install, reuse, failure and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "build\online-release\Voxprint-Setup-online.exe"
          Write-Host ("setup size: {0:N0} bytes" -f (Get-Item $setup).Length)
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\vxsmoke","/LOG=C:\vxsmoke1.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content C:\vxsmoke1.log -Tail 60; throw "install exit code $($p.ExitCode)" }
          foreach ($f in Get-ChildItem dist\Voxprint -Recurse -File) {
            $rel = $f.FullName.Substring((Resolve-Path dist\Voxprint).Path.Length + 1)
            $t = Join-Path C:\vxsmoke $rel
            if (-not (Test-Path $t)) { throw "missing after install: $rel" }
            if ((Get-FileHash $t).Hash -ne (Get-FileHash $f.FullName).Hash) { throw "different content: $rel" }
          }
          Get-Content C:\vxsmoke\voxprint-components.json
          if (Test-Path C:\vxsmoke\unins000.exe) { "uninstaller present" } else { throw "no uninstaller" }
          # second run: everything is reused (no component is downloaded again)
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\vxsmoke","/LOG=C:\vxsmoke2.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content C:\vxsmoke2.log -Tail 60; throw "second install exit code $($p.ExitCode)" }
          # an unreachable manifest must fail the setup (and leave a message, not a crash)
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\vxsmoke-bad","/Manifest=http://127.0.0.1:9/manifest.json","/LOG=C:\vxsmoke3.log" -Wait -PassThru
          Write-Host "unreachable manifest -> exit code $($p.ExitCode)"
          if ($p.ExitCode -eq 0) { throw "the setup reported success for an unreachable manifest" }
          # uninstall removes the downloaded files
          # no -Wait: the uninstaller starts a temporary copy of itself and Start-Process would wait for the whole tree
          $p = Start-Process C:\vxsmoke\unins000.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=C:\vxsmoke-un.log" -PassThru
          for ($i = 0; $i -lt 60 -and (Test-Path C:\vxsmoke\Voxprint.exe); $i++) { Start-Sleep 2 }
          Get-Process | Where-Object { $_.ProcessName -like "unins*" -or $_.ProcessName -like "*vxsmoke*" } | Format-Table Id, ProcessName
          if (Test-Path C:\vxsmoke\Voxprint.exe) { if (Test-Path C:\vxsmoke-un.log) { Get-Content C:\vxsmoke-un.log -Tail 30 }; throw "files left after the uninstall" }
          "uninstalled"
      - name: Logs
        if: always()
        shell: pwsh
        run: |
          foreach ($l in "C:\vxsmoke1.log","C:\vxsmoke2.log","C:\vxsmoke3.log","C:\vxsmoke-un.log") { if (Test-Path $l) { "== $l"; Get-Content $l -Tail 25 } }

  # THIN installer (docs/THIN-INSTALLER.md): fake shell + fake site-packages -> build_online.ps1 -Thin -> silent install installs only the
  # shell -> the app's module manager downloads the runtime modules.  Also checks the Windows adapter enumeration of netroute.
  thin-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: PyInstaller
        shell: pwsh
        run: python -m pip install --quiet pyinstaller
      - name: Windows network adapters (infra/netroute.py)
        shell: pwsh
        run: |
          python -c "from infra import netroute as n; w = n._from_windows(); print('ctypes:', w); a = n.local_addresses(); print('all:', a); import sys; sys.exit(0 if w and a else 1)"
      - name: A fake thin shell and a fake site-packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Voxprint\_internal, build\notices | Out-Null
          Copy-Item "$env:WINDIR\System32\whoami.exe" dist\Voxprint\Voxprint.exe
          python -c "import os; open('dist/Voxprint/_internal/shell.bin','wb').write(os.urandom(2*1024*1024))"
          Copy-Item THIRD_PARTY_NOTICES.md build\notices\
          @'
          import os, pathlib
          site = pathlib.Path("build/fake-site"); site.mkdir(parents=True, exist_ok=True)
          def dist(name, files):
              di = site / f"{name}-1.0.dist-info"; di.mkdir(exist_ok=True)
              (di / "METADATA").write_text(f"Metadata-Version: 2.1\nName: {name}\nVersion: 1.0\n")
              rec = []
              for rel, n in files.items():
                  p = site / rel; p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(os.urandom(n)); rec.append(rel + ",,")
              rec += [f"{name}-1.0.dist-info/METADATA,,", f"{name}-1.0.dist-info/RECORD,,"]
              (di / "RECORD").write_text("\n".join(rec) + "\n")
          dist("torch", {"torch/__init__.py": 40, "torch/lib/big.dll": 3000000})
          dist("scipy", {"scipy/__init__.py": 40})
          dist("transformers", {"transformers/__init__.py": 40})
          dist("numpy", {"numpy/__init__.py": 40})
          '@ | python -
      - name: Build the thin installer (small parts, served from localhost)
        shell: pwsh
        run: |
          ./installer/build_online.ps1 -Thin -RuntimeSite build\fake-site -Tag v0.0.0-beta -BaseUrl http://127.0.0.1:8098 -ManifestUrl http://127.0.0.1:8098/manifest-beta.json -LimitMib 1 -Python python
          Start-Process python -ArgumentList "-m","http.server","8098","--bind","127.0.0.1","--directory","build\online-release" -WindowStyle Hidden
          Start-Sleep 3
      - name: Silent install puts only the shell on the disk; the module manager downloads the rest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process build\online-release\Voxprint-Setup-thin.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\vxthin","/LOG=C:\vxthin.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content C:\vxthin.log -Tail 60; throw "install exit code $($p.ExitCode)" }
          if (-not (Test-Path C:\vxthin\Voxprint.exe)) { throw "the shell is missing" }
          if (-not (Test-Path C:\vxthin\_internal\modules.json)) { throw "modules.json is missing" }
          if (Test-Path C:\vxthin\_internal\torch) { throw "the thin installer installed a runtime module" }
          $env:VOXPRINT_MODULES_CONFIG = "C:\vxthin\_internal\modules.json"
          $env:VOXPRINT_HOME = "C:\vxhome"
          python main.py --modules-status
          python main.py --install-modules
          if ($LASTEXITCODE -ne 0) { throw "--install-modules failed" }
          if (-not (Test-Path C:\vxhome\runtime\torch\lib\big.dll)) { throw "the torch module was not unpacked into the runtime folder" }
          python main.py --modules-status
      - name: Setup log
        if: always()
        shell: pwsh
        run: if (Test-Path C:\vxthin.log) { Get-Content C:\vxthin.log -Tail 40 }

  # THE ONLINE INSTALLER (docs/THIN-INSTALLER.md): builds only our small shell (Qt + program) and a manifest that points to the libraries at
  # their upstream sites (PyPI, download.pytorch.org - infra/runtime_lock.json).  No PyTorch is installed, repacked or uploaded here: minutes, not an hour.
  # Besides building, the job really installs the runtime from upstream with the frozen shell (CPU PyTorch = 100 MB) and imports it,
  # then repeats it with "another program's" PyTorch to prove the reuse path.
  build-thin:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.smoke_only && !inputs.build_full }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      REL_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Visual C++ runtime from Microsoft (embedded in the installer, installed only when the PC lacks it)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\redist | Out-Null
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile installer\redist\vc_redist.x64.exe
      - name: The lock is still valid (every file exists upstream with the pinned size)
        shell: pwsh
        run: python tools\check_lock_urls.py
      - name: Shell environment (only the pinned packages the shell bundles) + PyInstaller
        shell: pwsh
        run: |
          python -m venv .venv
          python tools\make_runtime_lock.py --test-requirements | Out-File -Encoding ascii build-req.txt
          Get-Content build-req.txt
          .venv\Scripts\python.exe -m pip install --quiet -r build-req.txt pyinstaller pytest
      - name: Tests that need no PyTorch
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q --deselect tests/test_ui.py::test_selftest_imports_reports_and_writes_log --deselect tests/test_frozen_install.py --deselect tests/test_linux_package.py::test_text_selftest_passes_without_models
      - name: Thin shell (PyInstaller, heavy libraries excluded)
        shell: cmd
        run: build_thin.bat
      - name: Online installer = shell zip + manifest (libraries stay upstream) + Voxprint-Setup-online.exe
        shell: pwsh
        run: |
          $tag = if ($env:REL_TAG) { $env:REL_TAG } else { "v0.0.0-dev" }
          ./installer/build_online.ps1 -Dist dist\thin\Voxprint -Tag $tag -Repo "${{ github.repository }}" -Thin -RuntimeLock infra\runtime_lock.json
          Get-ChildItem build\online-release | Format-Table Name, Length
      - name: End to end with the frozen shell - download the runtime from upstream (CPU PyTorch) and import it
        shell: pwsh
        env:
          VOXPRINT_TORCH_FLAVOR: cpu
          VOXPRINT_NO_REUSE: "1"
          VOXPRINT_HOME: C:\vxhome1
        run: |
          $ErrorActionPreference = "Stop"
          # the few files we ship ourselves (the shell, wheels built from sdists) are not on the release yet: serve them from localhost
          $tag = if ($env:REL_TAG) { $env:REL_TAG } else { "v0.0.0-dev" }
          $src = (Resolve-Path build\online-release\manifest-thin-*.json).Path
          $man = "C:\vx-manifest.json"
          (Get-Content $src -Raw).Replace("https://github.com/${{ github.repository }}/releases/download/$tag", "http://127.0.0.1:8099") | Out-File -Encoding ascii $man
          Start-Process python -ArgumentList "-m","http.server","8099","--bind","127.0.0.1","--directory","build\online-release" -WindowStyle Hidden
          Start-Sleep 3
          @{ schema = 1; manifest_url = $man } | ConvertTo-Json | Out-File -Encoding ascii C:\vx-modules.json
          $env:VOXPRINT_MODULES_CONFIG = "C:\vx-modules.json"
          $exe = (Resolve-Path dist\thin\Voxprint\Voxprint.exe).Path
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $exe -ArgumentList "--install-modules" -Wait -PassThru
          "install-modules: exit $($p.ExitCode) in $([int]$sw.Elapsed.TotalSeconds) s"
          Get-Content C:\vxhome1\logs\modules.txt | Select-Object -Last 15
          if ($p.ExitCode -ne 0) { throw "--install-modules failed" }
          $p = Start-Process $exe -ArgumentList "--probe-torch" -Wait -PassThru
          Get-Content C:\vxhome1\logs\probe_torch.txt
          if ($p.ExitCode -ne 0) { throw "the frozen shell cannot import the downloaded PyTorch" }
      - name: End to end - another program's PyTorch is detected, checked and reused instead of downloaded
        shell: pwsh
        env:
          VOXPRINT_TORCH_FLAVOR: cpu
          VOXPRINT_HOME: C:\vxhome2
        run: |
          $ErrorActionPreference = "Stop"
          # "another program": a venv-like folder that holds the torch wheels we downloaded in the previous step
          New-Item -ItemType Directory -Force C:\otherapp\.venv\Lib\site-packages | Out-Null
          Get-ChildItem C:\vxhome1\runtime -Directory | Where-Object { $_.Name -like "torch*" } | ForEach-Object { Copy-Item $_.FullName C:\otherapp\.venv\Lib\site-packages\ -Recurse }
          Get-ChildItem C:\otherapp\.venv\Lib\site-packages | Select-Object -ExpandProperty Name
          $env:VOXPRINT_MODULES_CONFIG = "C:\vx-modules.json"
          $env:VIRTUAL_ENV = "C:\otherapp\.venv"
          $exe = (Resolve-Path dist\thin\Voxprint\Voxprint.exe).Path
          $p = Start-Process $exe -ArgumentList "--install-modules" -Wait -PassThru
          Get-Content C:\vxhome2\logs\modules.txt
          Get-Content C:\vxhome2\logs\voxprint.log -ErrorAction SilentlyContinue | Select-String "reuse|PyTorch|torch" | Select-Object -Last 12
          if ($p.ExitCode -ne 0) { throw "--install-modules failed" }
          $line = Get-Content C:\vxhome2\logs\modules.txt | Select-String "^torch" | Select-Object -First 1
          if ($line -notmatch "reused") { throw "PyTorch was not reused: $line" }
          if (Test-Path C:\vxhome2\runtime\torch) { throw "PyTorch was downloaded although it is on the PC" }
          $p = Start-Process $exe -ArgumentList "--probe-torch" -Wait -PassThru
          Get-Content C:\vxhome2\logs\probe_torch.txt
          if ($p.ExitCode -ne 0) { throw "the reused PyTorch does not work" }
      - uses: actions/upload-artifact@v4
        with:
          name: Voxprint-Setup-online
          path: |
            build/online-release/Voxprint-Setup-online.exe
            build/online-release/Voxprint-Setup-online.exe.sha256
            build/online-release/manifest-thin-*.json
          retention-days: 14
      - name: Attach to the release (installer, hash, manifest, shell parts; older assets are not touched)
        if: ${{ env.REL_TAG != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem build\online-release -File | ForEach-Object { $_.FullName } | Sort-Object { (Get-Item $_).Length }
          foreach ($f in $files) { gh release upload $env:REL_TAG $f --clobber; if ($LASTEXITCODE -ne 0) { throw "upload failed: $f" } }

  build:
    if: ${{ !inputs.smoke_only && (github.event_name != 'workflow_dispatch' || inputs.build_full) }}
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      QT_QPA_PLATFORM: offscreen            # the tests create Qt widgets without a display
      VOX_TORCH_BACKEND: cu128              # CUDA wheels even though the runner has no GPU (the installer is for GPU machines)
      PYTHONUTF8: "1"
      VOX_SKIP_INSTALLER: ${{ (github.event_name == 'workflow_dispatch' && !inputs.build_full) && '1' || '' }}   # no full Inno compile when only the online installer is wanted
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the PyTorch CUDA wheels, the PyInstaller folder and the installer take about 20 GB)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Get-PSDrive C | Format-Table Used, Free

      - name: Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Visual C++ runtime for the installer (optional, installed silently by the setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\redist | Out-Null
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile installer\redist\vc_redist.x64.exe

      - name: build.bat onedir (venv, dependencies, notices, tests, PyInstaller, Inno Setup)
        shell: cmd
        run: build.bat onedir

      - name: Name the installer and write its SHA-256
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_full }}
        shell: pwsh
        run: |
          Move-Item installer\Output\Voxprint-Setup.exe installer\Output\Voxprint-Setup-github-build.exe
          $h = (Get-FileHash installer\Output\Voxprint-Setup-github-build.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Voxprint-Setup-github-build.exe" | Out-File -Encoding ascii installer\Output\Voxprint-Setup-github-build.exe.sha256
          Get-Item installer\Output\* | Format-Table Name, Length
          Get-Content installer\Output\Voxprint-Setup-github-build.exe.sha256

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_full }}
        with:
          name: Voxprint-Setup-github-build
          path: |
            installer/Output/Voxprint-Setup-github-build.exe
            installer/Output/Voxprint-Setup-github-build.exe.sha256
          compression-level: 0
          retention-days: 14

      - name: Attach to the release (tag builds, or a dispatch with release_tag; GitHub allows 2 GiB per asset)
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_full) && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          gh release view $env:REL_TAG 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:REL_TAG --prerelease --title "$env:REL_TAG" --notes "Built from source by GitHub Actions." }
          gh release upload $env:REL_TAG installer\Output\Voxprint-Setup-github-build.exe installer\Output\Voxprint-Setup-github-build.exe.sha256 --clobber

      - name: Online installer - free the space of the full installer, build helper + payload parts + Voxprint-Setup-online.exe
        shell: pwsh
        env:
          REL_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          Remove-Item installer\Output\* -Force -ErrorAction SilentlyContinue
          Get-PSDrive C | Format-Table Used, Free
          $tag = if ($env:REL_TAG) { $env:REL_TAG } else { "v0.0.0-dev" }
          ./installer/build_online.ps1 -Tag $tag -Repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Voxprint-Setup-online
          path: |
            build/online-release/Voxprint-Setup-online.exe
            build/online-release/Voxprint-Setup-online.exe.sha256
            build/online-release/manifest-*.json
          retention-days: 14

      - name: Attach the online installer, the manifest and the payload parts to the release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          $files = Get-ChildItem build\online-release | ForEach-Object { $_.FullName }
          # the small files first (installer, hash, manifest), then the big parts; --clobber replaces an older build of the same tag
          $sorted = $files | Sort-Object { (Get-Item $_).Length }
          foreach ($f in $sorted) { gh release upload $env:REL_TAG $f --clobber; if ($LASTEXITCODE -ne 0) { throw "upload failed: $f" } }
