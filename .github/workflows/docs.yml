# Documentation site. Pull requests build with mkdocs --strict and fail when public
# docstring coverage drops under 70%. A push to main also publishes GitHub Pages.
#
# Pages has to be enabled once, by the repository owner:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Until that is set, the deploy job on main cannot publish.
name: docs
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      VOXPRINT_ALLOW_NO_GPU: "1"
      VOXPRINT_NO_ENV_PROBE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libpulse0
      - name: Application and documentation tools
        run: |
          python -m pip install -q uv
          uv venv .app
          uv pip install --python .app/bin/python torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .app/bin/python -r requirements.txt -r requirements-verified.txt -r requirements-dev.txt
          uv pip install --python .app/bin/python --no-deps -r requirements-nodeps.txt
          uv pip install --python .app/bin/python -r requirements-docs.txt
      - name: Public docstrings and generated pages
        run: .app/bin/python -m pytest -q -p no:cacheprovider tests/test_docs_site.py
      - name: Build the site
        run: .app/bin/python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
