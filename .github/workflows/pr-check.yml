# Pull-request checks that workflow_dispatch cannot cover: native imports, the unit tests,
# a model-free speech smoke, and a Windows PyInstaller + Inno build of the online installer.
# Nothing here is published. The release installer is still built by build-installer.yml.
name: pr-check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      # internal: CI runners have no RTX 40-series GPU (infra/gpu_requirement.py); never a user option
      VOXPRINT_ALLOW_NO_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System libraries for Qt, ffmpeg and the offscreen tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libpulse0
      - name: CPU PyTorch and the application
        run: |
          python -m pip install -q uv
          uv venv .app
          uv pip install --python .app/bin/python torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .app/bin/python -r requirements.txt -r requirements-verified.txt -r requirements-dev.txt
          uv pip install --python .app/bin/python --no-deps -r requirements-nodeps.txt
          uv pip install --python .app/bin/python -r requirements-docs.txt
      - name: Import every native dependency
        run: .app/bin/python tools/check_native_imports.py
      - name: Unit tests
        run: |
          set -o pipefail
          fail=0
          failed=
          # One process per module. A native crash (Qt plus torch, or the loopback read in
          # test_thin_modules) must not abort the rest of the suite, and must still fail this job.
          for f in tests/test_*.py; do
            echo "=== $f ==="
            set +e
            .app/bin/python -m pytest -q -p no:cacheprovider -p faulthandler --tb=line "$f"
            rc=$?
            set -e
            # 5: the module collected nothing (optional imports such as weasyprint). A signal or a failed test still fails the job.
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ]; then
              if [ "$rc" -eq 5 ]; then echo "no tests collected in $f"; fi
            else
              echo "FAILED $f (exit $rc)"
              fail=1
              failed="$failed $f"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Failed modules:$failed"
            exit 1
          fi
      - name: Model-free text and speech smokes
        run: |
          .app/bin/python main.py --selftest-text
          .app/bin/python main.py --selftest-speech
      - name: Shared models root survives uninstall
        run: .app/bin/python -m pytest -q tests/test_suite_roots.py --tb=short

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      # internal: CI runners have no RTX 40-series GPU (infra/gpu_requirement.py); never a user option
      VOXPRINT_ALLOW_NO_GPU: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: CPU PyTorch and the application
        shell: pwsh
        run: |
          python -m pip install -q uv
          uv venv .app
          uv pip install --python .app/Scripts/python.exe torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .app/Scripts/python.exe -r requirements.txt -r requirements-verified.txt -r requirements-dev.txt
          uv pip install --python .app/Scripts/python.exe --no-deps -r requirements-nodeps.txt
          uv pip install --python .app/Scripts/python.exe -r requirements-docs.txt
      - name: Import every native dependency
        shell: pwsh
        run: .app\Scripts\python.exe tools\check_native_imports.py
      - name: Unit tests
        shell: pwsh
        run: |
          $failed = @()
          # One process per module. A native crash must not abort the rest of the suite, and must still fail this job.
          foreach ($f in Get-ChildItem tests\test_*.py) {
            Write-Host "=== $($f.FullName) ==="
            $script:recorded = $null
            & .app\Scripts\python.exe -m pytest -q -p no:cacheprovider -p faulthandler --tb=line $f.FullName 2>&1 | ForEach-Object {
              $line = "$_"
              Write-Host $line
              if ($line -match 'VOXPRINT_PYTEST_RC=(\d+)') { $script:recorded = [int]$Matches[1] }
            }
            # Prefer the status pytest recorded before shutdown. A Qt DLL detach on Python 3.14 can still
            # make the process exit non-zero after a green session. No recorded status means the process
            # died during the tests: that still fails the job. 5: nothing collected (optional imports).
            $rc = $LASTEXITCODE
            if ($null -ne $script:recorded) { $rc = $script:recorded }
            if ($rc -eq 5) { Write-Host "no tests collected: $($f.Name)" }
            elseif ($rc -ne 0) { $failed += $f.Name }
          }
          if ($failed.Count -gt 0) {
            Write-Host "Failed modules: $($failed -join ', ')"
            exit 1
          }
      - name: Model-free text and speech smokes
        shell: pwsh
        run: |
          .app\Scripts\python.exe main.py --selftest-text
          .app\Scripts\python.exe main.py --selftest-speech
      - name: Shared models root survives uninstall
        shell: pwsh
        run: .app\Scripts\python.exe -m pytest -q tests\test_suite_roots.py --tb=short

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      # internal: CI runners have no RTX 40-series GPU (infra/gpu_requirement.py); never a user option
      VOXPRINT_ALLOW_NO_GPU: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Visual C++ runtime from Microsoft (embedded only when the file is present)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\redist | Out-Null
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile installer\redist\vc_redist.x64.exe
      - name: The lock is still valid (every file exists upstream with the pinned size)
        shell: pwsh
        run: python tools\check_lock_urls.py
      - name: Shell environment (pinned packages the shell bundles) and PyInstaller
        shell: pwsh
        run: |
          python -m venv .venv
          python tools\make_runtime_lock.py --test-requirements | Out-File -Encoding ascii build-req.txt
          Get-Content build-req.txt
          .venv\Scripts\python.exe -m pip install --quiet -r build-req.txt pyinstaller
      - name: Build number and codename (BUILD.json build field or the release tag; BUILD.json is not changed)
        shell: pwsh
        run: |
          $n = python tools\build_number.py --stamp
          if ($LASTEXITCODE -ne 0) { throw "build number failed" }
          $c = (Get-Content BUILD.json -Raw | ConvertFrom-Json).codename
          "VOXPRINT_BUILD=$n" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VOXPRINT_CODENAME=$c" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "build $n `"$c`""
      - name: Thin shell (PyInstaller)
        shell: cmd
        run: build_thin.bat
      - name: Online installer (Inno, local manifest, then a silent install)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./installer/build_online.ps1 -Dist "dist\thin\voxprint-audiobook-builder" -Tag v0.0.0-beta -Repo "${{ github.repository }}" -Thin -RuntimeLock infra\runtime_lock.json -BaseUrl http://127.0.0.1:8097 -ManifestUrl http://127.0.0.1:8097/manifest-thin-beta.json
          python tools\check_manifest_tags.py build\online-release
          if ($LASTEXITCODE -ne 0) { throw "a manifest URL names a GitHub tag that does not exist" }
          if (Select-String -Path build\online-release\*.json -Pattern "v0.0.0-dev" -Quiet) { throw "manifest still points at v0.0.0-dev" }
          Get-ChildItem build\online-release | Format-Table Name, Length
          $setup = Get-Item build\online-release\voxprint-audiobook-builder-setup-win-x64.exe
          $versioned = @(Get-ChildItem build\online-release\voxprint-audiobook-builder-setup-*-win-x64.exe)
          if ($versioned.Count -lt 1) { throw "versioned setup file was not written" }
          "installer bytes: $($setup.Length)"
          "installer MiB: $([math]::Round($setup.Length / 1MB, 1))"
          Start-Process python -ArgumentList "-m","http.server","8097","--bind","127.0.0.1","--directory","build\online-release" -WindowStyle Hidden
          Start-Sleep 3
          (Invoke-WebRequest http://127.0.0.1:8097/manifest-thin-beta.json -UseBasicParsing).StatusCode
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SKIPGPUCHECK","/SkipSuite=1","/DIR=C:\vxmdl","/LOG=C:\vxmdl.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content C:\vxmdl.log -Tail 80; throw "install exit code $($p.ExitCode)" }
          if (-not (Test-Path C:\vxmdl\voxprint-audiobook-builder.exe)) { throw "the shell was not installed" }
          $env:VOXPRINT_HOME = "C:\vxmdl-home"
          $cli = "C:\vxmdl\voxprint-audiobook-cli.exe"
          if (-not (Test-Path $cli)) { throw "cli missing: $cli" }
          $models = "C:\vxmdl-home\models"
          New-Item -ItemType Directory -Force (Join-Path $models "movie-dubber") | Out-Null
          $marker = Join-Path $models "movie-dubber\weights.bin"
          Set-Content -Path $marker -Value "other-app" -Encoding ascii
          $shared = "C:\vxmdl-home\shared"
          New-Item -ItemType Directory -Force $shared | Out-Null
          $stored = ($models -replace '\\', '/')
          $sha = "ab" * 32
          @"
{
  "schema": 1,
  "components": {
    "shared-models": {
      "kind": "model",
      "version": "1",
      "path": "$stored",
      "sha256": "$sha",
      "installed_at": "2026-01-01T00:00:00+00:00",
      "refs": ["audiobook-builder"]
    }
  }
}
"@ | Set-Content -Encoding utf8 (Join-Path $shared "manifest.json")
          & $cli --unregister-suite
          if ($LASTEXITCODE -ne 0) { throw "unregister-suite exited $LASTEXITCODE" }
          & $cli --unregister-runtime-user
          if ($LASTEXITCODE -ne 0) { throw "unregister-runtime-user exited $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $marker)) { throw "uninstall deleted another app's models" }
      - uses: actions/upload-artifact@v4
        with:
          name: voxprint-audiobook-builder-setup
          path: |
            build/online-release/voxprint-audiobook-builder-setup*.exe
            build/online-release/voxprint-audiobook-builder-setup*.exe.sha256
            build/online-release/manifest-thin-*.json
          retention-days: 14
