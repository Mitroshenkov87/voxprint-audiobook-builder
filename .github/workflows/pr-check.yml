# Pull-request checks that workflow_dispatch cannot cover: native imports, the unit tests,
# a model-free speech smoke, and a Windows PyInstaller + Inno build of the online installer.
# Nothing here is published. The release installer is still built by build-installer.yml.
name: pr-check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System libraries for Qt, ffmpeg and the offscreen tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libpulse0
      - name: CPU PyTorch and the application
        run: |
          python -m pip install -q uv
          uv venv .app
          uv pip install --python .app/bin/python torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .app/bin/python -r requirements.txt -r requirements-verified.txt -r requirements-dev.txt
          uv pip install --python .app/bin/python --no-deps -r requirements-nodeps.txt
      - name: Import every native dependency
        run: .app/bin/python tools/check_native_imports.py
      - name: Unit tests
        run: |
          set -o pipefail
          fail=0
          failed=
          # One process per module. A native crash (Qt plus torch, or the loopback read in
          # test_thin_modules) must not abort the rest of the suite, and must still fail this job.
          for f in tests/test_*.py; do
            echo "=== $f ==="
            if ! .app/bin/python -m pytest -q -p no:cacheprovider -p faulthandler --tb=line "$f"; then
              echo "FAILED $f"
              fail=1
              failed="$failed $f"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Failed modules:$failed"
            exit 1
          fi
      - name: Model-free text and speech smokes
        run: |
          .app/bin/python main.py --selftest-text
          .app/bin/python main.py --selftest-speech

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: CPU PyTorch and the application
        shell: pwsh
        run: |
          python -m pip install -q uv
          uv venv .app
          uv pip install --python .app/Scripts/python.exe torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .app/Scripts/python.exe -r requirements.txt -r requirements-verified.txt -r requirements-dev.txt
          uv pip install --python .app/Scripts/python.exe --no-deps -r requirements-nodeps.txt
      - name: Import every native dependency
        shell: pwsh
        run: .app\Scripts\python.exe tools\check_native_imports.py
      - name: Unit tests
        shell: pwsh
        run: |
          $failed = @()
          # One process per module. A native crash must not abort the rest of the suite, and must still fail this job.
          foreach ($f in Get-ChildItem tests\test_*.py) {
            Write-Host "=== $($f.FullName) ==="
            & .app\Scripts\python.exe -m pytest -q -p no:cacheprovider -p faulthandler --tb=line $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $f.Name }
          }
          if ($failed.Count -gt 0) {
            Write-Host "Failed modules: $($failed -join ', ')"
            exit 1
          }
      - name: Model-free text and speech smokes
        shell: pwsh
        run: |
          .app\Scripts\python.exe main.py --selftest-text
          .app\Scripts\python.exe main.py --selftest-speech

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Visual C++ runtime from Microsoft (embedded only when the file is present)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\redist | Out-Null
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile installer\redist\vc_redist.x64.exe
      - name: The lock is still valid (every file exists upstream with the pinned size)
        shell: pwsh
        run: python tools\check_lock_urls.py
      - name: Shell environment (pinned packages the shell bundles) and PyInstaller
        shell: pwsh
        run: |
          python -m venv .venv
          python tools\make_runtime_lock.py --test-requirements | Out-File -Encoding ascii build-req.txt
          Get-Content build-req.txt
          .venv\Scripts\python.exe -m pip install --quiet -r build-req.txt pyinstaller
      - name: Build number and codename (read from BUILD.json; the file is not changed)
        shell: pwsh
        run: |
          $n = python tools\build_number.py --stamp
          if ($LASTEXITCODE -ne 0) { throw "build number failed" }
          $c = (Get-Content BUILD.json -Raw | ConvertFrom-Json).codename
          "VOXPRINT_BUILD=$n" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VOXPRINT_CODENAME=$c" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "build $n `"$c`""
      - name: Thin shell (PyInstaller)
        shell: cmd
        run: build_thin.bat
      - name: Online installer (Inno, not published)
        shell: pwsh
        run: |
          ./installer/build_online.ps1 -Dist dist\thin\Voxprint -Tag v0.0.0-dev -Repo "${{ github.repository }}" -Thin -RuntimeLock infra\runtime_lock.json
          Get-ChildItem build\online-release | Format-Table Name, Length
          $setup = Get-ChildItem build\online-release\Voxprint-Setup-online*.exe | Select-Object -First 1
          "installer bytes: $($setup.Length)"
          "installer MiB: $([math]::Round($setup.Length / 1MB, 1))"
      - uses: actions/upload-artifact@v4
        with:
          name: Voxprint-Setup-online
          path: |
            build/online-release/Voxprint-Setup-online*.exe
            build/online-release/Voxprint-Setup-online*.exe.sha256
            build/online-release/manifest-thin-*.json
          retention-days: 14
